name: Migrate personal site from rad

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-personal-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout personal-site repository
        uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 0

      - name: Checkout production snapshot from source repository
        uses: actions/checkout@v4
        with:
          repository: rad03i2/rad
          ref: site-prod
          path: source
          fetch-depth: 1

      - name: Replace target contents with personal site only
        shell: bash
        run: |
          set -euo pipefail
          cd target

          # Keep only Git metadata while rebuilding the working tree from the
          # currently deployed personal-site snapshot.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          copy_item() {
            local item="$1"
            if [ ! -e "../source/$item" ]; then
              echo "Required source item is missing: $item" >&2
              exit 1
            fi
            cp -a "../source/$item" .
          }

          # Personal-site root files and directories. Mikhbar/forum/automation
          # content is deliberately not part of this allowlist.
          for item in \
            .well-known \
            404.html \
            README.md \
            SEO-SETUP.md \
            about-radwan-abdulhadi.html \
            admin.html \
            blog \
            enhancements.css \
            enhancements.js \
            favicon.ico \
            feed.xml \
            ff7de3f199bfcac8fda652aec7caabcd.txt \
            humans.txt \
            index.html \
            llms-full.txt \
            llms.txt \
            manifest.webmanifest \
            notes \
            offline.html \
            opensearch.xml \
            projects.css \
            projects.json \
            projects \
            robots.txt \
            script.js \
            service-worker.js \
            services \
            sitemap-main.xml \
            sitemap.xml \
            styles.css
          do
            copy_item "$item"
          done

          mkdir -p assets
          cp -a ../source/assets/Radwan-CV.pdf assets/
          cp -a ../source/assets/Radwan-Portfolio.pdf assets/
          cp -a ../source/assets/fonts assets/
          cp -a ../source/assets/images assets/
          cp -a ../source/assets/rad-icon.svg assets/
          cp -a ../source/assets/social assets/

          # This image belongs to Mikhbar, not to the personal portfolio.
          rm -f assets/images/mikhbar-favicon.png

          # Guardrails: abort if any known Mikhbar application directories or
          # brand assets somehow entered the target.
          test ! -e automation
          test ! -e forum
          test ! -e assets/brand
          test ! -e assets/images/mikhbar-favicon.png

          # Do not retain this one-time migration workflow in the finished repo.
          rm -rf .github

      - name: Verify essential personal-site files
        shell: bash
        run: |
          set -euo pipefail
          cd target
          test -s index.html
          test -s styles.css
          test -s script.js
          test -s projects/index.html
          test -s blog/index.html
          test -s notes/index.html
          test -s services/index.html
          test -s assets/images/radwan-profile.webp
          test -s assets/images/radwan-favicon.png
          test -s assets/Radwan-CV.pdf
          test -s sitemap.xml
          ! grep -RIl --exclude='README.md' -E 'Mikhbar|مخبار' . >/tmp/mikhbar_hits || true
          if [ -s /tmp/mikhbar_hits ]; then
            echo 'Warning: textual Mikhbar references remain in:'
            cat /tmp/mikhbar_hits
          fi

      - name: Commit migrated site
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git config user.name 'Radwan Abdulhadi Ahmed'
          git config user.email '127021904+rad03i2@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes were necessary.'
            exit 0
          fi
          git commit -m 'Migrate personal portfolio from rad site-prod'
          git push origin HEAD:main
